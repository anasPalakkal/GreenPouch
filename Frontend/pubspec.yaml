name: front_end
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  toastification: ^2.1.0
  provider: ^6.1.2
  http: ^0.13.6
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  url_launcher: ^6.2.5
  intl: ^0.18.0
  connectivity_plus: ^6.0.0
  uuid: ^4.3.3
  fl_chart: ^0.66.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  lucide_icons: 0.257.0
  socket_io_client: 3.1.4
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^18.0.1
  flutter_native_splash: ^2.4.0
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/GrassHopper.png
    - assets/images/login.png
    - assets/images/homeicon.png
    
    - assets/sounds/income.mp3
    - assets/sounds/expense.mp3
    - assets/sounds/transfer.mp3
    - assets/sounds/goal_deposit.mp3
    - assets/sounds/goal_withdraw.mp3
    - assets/sounds/reverse.mp3

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-regular.ttf
          weight: 400
        - asset: assets/fonts/inter-medium.ttf
          weight: 500
        - asset: assets/fonts/inter-semibold.ttf
          weight: 600
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/GrassHopper.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/GrassHopper.png" 